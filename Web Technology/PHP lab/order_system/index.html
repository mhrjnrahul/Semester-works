<!DOCTYPE html>
<html>
<head>
  <title>Product Order System</title>
  <style>
    body { font-family: Arial; }
    .navbar {
      background-color: #333;
      overflow: hidden;
    }
    .navbar a, .dropdown button {
      float: left;
      display: block;
      color: white;
      padding: 14px 16px;
      text-decoration: none;
      background-color: inherit;
      border: none;
      cursor: pointer;
    }
    .navbar a:hover, .dropdown:hover button {
      background-color: #575757;
    }
    .dropdown {
      float: left;
      overflow: hidden;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #444;
      min-width: 160px;
    }
    .dropdown-content a {
      float: none;
      color: white;
      padding: 12px 16px;
      display: block;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

<div class="navbar">
  <a href="#">Home</a>
  <div class="dropdown">
    <button>Menu</button>
    <div class="dropdown-content">
      <a href="order.html">Order Product</a>
    </div>
  </div>
</div>

</body>
</html>
